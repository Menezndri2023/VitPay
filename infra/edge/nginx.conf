# VITPAY — point d'entrée unique de la pile sandbox.
# L'en-tête X-Forwarded-For fourni par le client est ÉCRASÉ par l'adresse réelle de la connexion :
# l'API ne fait confiance qu'au réseau interne « edge » (TRUST_PROXY), où seuls ce proxy et les apps
# Next (qui relaient l'en-tête sans le modifier) sont présents. En production : même principe au
# niveau du répartiteur de charge de l'hébergeur (docs/SECURITY.md).
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 8m; # justificatifs KYB (5 Mo) + marge multipart

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_redirect off;

  server { listen 3710; location / { proxy_pass http://pay:3710; } }
  server { listen 3711; location / { proxy_pass http://business:3711; } }
  server { listen 3712; location / { proxy_pass http://admin:3712; } }
  server { listen 4710; location / { proxy_pass http://api:4710; } }
}
