# VITPAY PRODUCTION — pile complète, données RÉELLES.
# Lancement et exploitation : docs/PRODUCTION.md. Valeurs sensibles : .env généré sur le serveur
# par scripts/generate-env.sh (jamais versionné).
#
# Garde-fous imposés ici et par la configuration de l'API (qui refuse de démarrer sinon) :
#   - APP_ENV=production : prestataire simulé interdit, HTTPS et cookies sécurisés obligatoires ;
#   - paiements réels FERMÉS par défaut : ils ne s'ouvrent qu'avec PAYMENTS_LIVE_ENABLED=true ET la
#     référence du procès-verbal d'activation LEGAL_SIGNOFF_REF (docs/COMPLIANCE.md §3).
name: vitpay-production

x-api-env: &api-env
  NODE_ENV: production
  APP_ENV: production
  PORT: "4710"
  DATABASE_URL: postgres://vitpay_app:${PG_APP_PASSWORD}@postgres:5432/vitpay
  DATABASE_SYSTEM_URL: postgres://vitpay_system:${PG_SYSTEM_PASSWORD}@postgres:5432/vitpay
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
  APP_ENCRYPTION_KEYS_PREVIOUS: ${APP_ENCRYPTION_KEYS_PREVIOUS:-}
  PUBLIC_API_URL: https://api.${PROD_DOMAIN}${PROD_URL_PORT:-}
  PAY_BASE_URL: https://pay.${PROD_DOMAIN}${PROD_URL_PORT:-}
  BUSINESS_APP_URL: https://app.${PROD_DOMAIN}${PROD_URL_PORT:-}
  ALLOWED_ORIGINS: https://pay.${PROD_DOMAIN}${PROD_URL_PORT:-},https://app.${PROD_DOMAIN}${PROD_URL_PORT:-},https://admin.${PROD_DOMAIN}${PROD_URL_PORT:-}
  MOCK_PSP_ENABLED: "false"
  PAYMENTS_LIVE_ENABLED: ${PAYMENTS_LIVE_ENABLED:-false}
  LEGAL_SIGNOFF_REF: ${LEGAL_SIGNOFF_REF:-}
  YOUCAN_REFUNDS_ENABLED: ${YOUCAN_REFUNDS_ENABLED:-false}
  COOKIE_SECURE: "true"
  ALLOW_PRIVATE_WEBHOOK_URLS: "false"
  EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
  SMTP_URL: ${SMTP_URL:-}
  EMAIL_FROM: ${EMAIL_FROM}
  # Seuls Caddy et les apps Next (adresses fixes du réseau « edge ») sont approuvés pour X-Forwarded-For.
  TRUST_PROXY: 172.31.10.10,172.31.10.11,172.31.10.12,172.31.10.13
  METRICS_TOKEN: ${METRICS_TOKEN}
  LOG_LEVEL: info

x-web-build: &web-build
  context: ../..
  dockerfile: infra/docker/web.Dockerfile

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD}
      POSTGRES_DB: vitpay
      PG_OWNER_PASSWORD: ${PG_OWNER_PASSWORD}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD}
      PG_SYSTEM_PASSWORD: ${PG_SYSTEM_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    # AUCUN port publié : la base n'est joignable que depuis le réseau interne.
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vitpay"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    image: vitpay/api:production
    command: ["node", "dist/src/database/migrate.cli.js"]
    environment:
      DATABASE_OWNER_URL: postgres://vitpay_owner:${PG_OWNER_PASSWORD}@postgres:5432/vitpay
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: vitpay/api:production
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *api-env
      WORKERS_ENABLED: "false"
    networks: [internal, edge]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    image: vitpay/api:production
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *api-env
      WORKERS_ENABLED: "true"
      PORT: "4711"
    # « edge » : accès sortant (prestataires, e-mails, webhooks des commerçants, protégés anti-SSRF).
    networks: [internal, edge]
    depends_on:
      migrate: { condition: service_completed_successfully }

  pay:
    build: { <<: *web-build, args: { APP: pay, NEXT_PUBLIC_VITPAY_ENV: production } }
    image: vitpay/pay:production
    restart: unless-stopped
    logging: *logging
    environment: { PORT: "3710" }
    networks: { edge: { ipv4_address: 172.31.10.11 } }
    depends_on: [api]

  business:
    build: { <<: *web-build, args: { APP: business, NEXT_PUBLIC_VITPAY_ENV: production } }
    image: vitpay/business:production
    restart: unless-stopped
    logging: *logging
    environment: { PORT: "3711" }
    networks: { edge: { ipv4_address: 172.31.10.12 } }
    depends_on: [api]

  admin:
    build: { <<: *web-build, args: { APP: admin, NEXT_PUBLIC_VITPAY_ENV: production } }
    image: vitpay/admin:production
    restart: unless-stopped
    logging: *logging
    environment: { PORT: "3712" }
    networks: { edge: { ipv4_address: 172.31.10.13 } }
    depends_on: [api]

  # Création d'un administrateur (seule voie en production) :
  #   docker compose run --rm create-admin <email> "<Nom complet>" <rôle>
  create-admin:
    image: vitpay/api:production
    profiles: [tools]
    entrypoint: ["node", "dist/src/database/create-admin.cli.js"]
    environment:
      <<: *api-env
      WORKERS_ENABLED: "false"
    networks: [internal]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Seul point d'entrée public : HTTPS automatique (Let's Encrypt), X-Forwarded-For écrasé.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN:-vitrine.localhost}
      ADMIN_BASIC_AUTH_USER: ${ADMIN_BASIC_AUTH_USER}
      ADMIN_BASIC_AUTH_HASH: ${ADMIN_BASIC_AUTH_HASH}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-0.0.0.0/0 ::/0}
      ACME_EMAIL: ${ACME_EMAIL}
      CADDY_GLOBAL_EXTRA: ${CADDY_GLOBAL_EXTRA:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: { edge: { ipv4_address: 172.31.10.10 } }
    depends_on: [api, pay, business, admin]

networks:
  internal:
    internal: true # aucun accès Internet pour la base
  edge:
    ipam:
      config: [{ subnet: 172.31.10.0/24 }]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
